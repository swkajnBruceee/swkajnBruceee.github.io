<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">HOPE 乒乓球机器人闭环控制架构</title>
  <desc id="desc">从观测与状态估计，到考虑反弹和球网约束的击球规划，再到全身强化学习控制与仿真执行的闭环系统。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071724"/><stop offset=".58" stop-color="#0a1d2a"/><stop offset="1" stop-color="#102a32"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#143346"/><stop offset="1" stop-color="#0b1f2e"/></linearGradient>
    <linearGradient id="cardWarm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a2830"/><stop offset="1" stop-color="#201d2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020b12" flood-opacity=".42"/></filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#efb26d"/></marker>
    <marker id="arrowFeedback" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78d4c5"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9dc8c2" stroke-opacity=".045"/></pattern>
  </defs>

  <rect width="1600" height="780" rx="32" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="778" rx="31" fill="url(#grid)" stroke="#7db9b0" stroke-opacity=".22"/>
  <circle cx="1430" cy="-40" r="270" fill="#65b8ae" opacity=".07"/><circle cx="110" cy="760" r="260" fill="#e7a05f" opacity=".045"/>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="74" y="68" font-size="16" letter-spacing="5" fill="#efb26d">HOPE / EMBODIED CONTROL</text>
    <text x="74" y="116" font-size="34" font-weight="700" fill="#eff7f1">从下一颗球，到下一次闭环</text>
    <text x="74" y="151" font-size="17" fill="#a9c7c2">把球的物理状态翻译成可执行的全身动作，再用接触证据检验每一层假设。</text>
    <g transform="translate(968 68)"><rect width="172" height="38" rx="19" fill="#123141" stroke="#78d4c5" stroke-opacity=".55"/><circle cx="23" cy="19" r="5" fill="#78d4c5"/><text x="43" y="24.5" font-size="13" fill="#d8eee8">Isaac Lab · 360 Hz</text></g>
    <g transform="translate(1152 68)"><rect width="160" height="38" rx="19" fill="#123141" stroke="#78d4c5" stroke-opacity=".55"/><circle cx="23" cy="19" r="5" fill="#78d4c5"/><text x="43" y="24.5" font-size="13" fill="#d8eee8">control · 90 Hz</text></g>
    <g transform="translate(1326 68)"><rect width="194" height="38" rx="19" fill="#362b27" stroke="#efb26d" stroke-opacity=".65"/><circle cx="23" cy="19" r="5" fill="#efb26d"/><text x="43" y="24.5" font-size="13" fill="#f4dfca">19-double contract</text></g>
  </g>

  <path d="M74 184H1526" stroke="#a7c8c2" stroke-opacity=".18"/>
  <g filter="url(#shadow)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(74 238)">
      <rect width="334" height="300" rx="22" fill="url(#card)" stroke="#63aaa4" stroke-width="2"/><rect width="334" height="7" rx="3.5" fill="#78d4c5"/>
      <circle cx="37" cy="51" r="18" fill="#78d4c5" opacity=".16" stroke="#78d4c5"/><text x="37" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#78d4c5">01</text><text x="74" y="57" font-size="23" font-weight="700" fill="#eff7f1">观测与状态估计</text>
      <text x="28" y="105" font-size="18" fill="#d7eee8">球与机器人的共同状态</text><path d="M28 126H306" stroke="#84b8b1" stroke-opacity=".22"/>
      <text x="28" y="160" font-size="16" fill="#9fc2bd">球：p̂ · v̂ · ω̂</text><text x="28" y="191" font-size="16" fill="#9fc2bd">本体：q · q̇ · 接触状态</text><text x="28" y="222" font-size="15" fill="#769a9a">mocap  /  joint encoders</text>
      <g transform="translate(28 246)"><rect width="112" height="30" rx="15" fill="#123b42"/><text x="56" y="20" text-anchor="middle" font-size="13" fill="#bce4dc">evidence stream</text></g>
    </g>
    <g transform="translate(442 238)">
      <rect width="334" height="300" rx="22" fill="url(#card)" stroke="#63aaa4" stroke-width="2"/><rect width="334" height="7" rx="3.5" fill="#80bfc0"/>
      <circle cx="37" cy="51" r="18" fill="#80bfc0" opacity=".16" stroke="#80bfc0"/><text x="37" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#a8dddd">02</text><text x="74" y="57" font-size="23" font-weight="700" fill="#eff7f1">物理规划</text>
      <text x="28" y="105" font-size="18" fill="#d7eee8">轨迹预测 → 击球目标</text><path d="M28 126H306" stroke="#84b8b1" stroke-opacity=".22"/>
      <text x="28" y="160" font-size="16" fill="#9fc2bd">drag · Magnus · bounce</text><text x="28" y="191" font-size="16" fill="#9fc2bd">table / net constraints</text><text x="28" y="222" font-size="15" fill="#769a9a">p* · v* · n* · t_hit</text>
      <g transform="translate(28 246)"><rect width="134" height="30" rx="15" fill="#153d44"/><text x="67" y="20" text-anchor="middle" font-size="13" fill="#bce4dc">target contract</text></g>
    </g>
    <g transform="translate(810 238)">
      <rect width="334" height="300" rx="22" fill="url(#card)" stroke="#a286b8" stroke-width="2"/><rect width="334" height="7" rx="3.5" fill="#c09bd6"/>
      <circle cx="37" cy="51" r="18" fill="#c09bd6" opacity=".16" stroke="#c09bd6"/><text x="37" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#d9b8e8">03</text><text x="74" y="57" font-size="23" font-weight="700" fill="#eff7f1">全身策略</text>
      <text x="28" y="105" font-size="18" fill="#e4d9ed">先验 + 学生策略</text><path d="M28 126H306" stroke="#b8a5c6" stroke-opacity=".24"/>
      <text x="28" y="160" font-size="16" fill="#c7b8d3">lower / upper-body priors</text><text x="28" y="191" font-size="16" fill="#c7b8d3">student：98D → 26D</text><text x="28" y="222" font-size="15" fill="#9d8cab">action blending · 31 DOF</text>
      <g transform="translate(28 246)"><rect width="116" height="30" rx="15" fill="#3c2e4b"/><text x="58" y="20" text-anchor="middle" font-size="13" fill="#e2c9f0">policy runtime</text></g>
    </g>
    <g transform="translate(1178 238)">
      <rect width="348" height="300" rx="22" fill="url(#cardWarm)" stroke="#d88656" stroke-width="2"/><rect width="348" height="7" rx="3.5" fill="#efb26d"/>
      <circle cx="37" cy="51" r="18" fill="#efb26d" opacity=".16" stroke="#efb26d"/><text x="37" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#efb26d">04</text><text x="74" y="57" font-size="23" font-weight="700" fill="#fff1e6">执行与验收</text>
      <text x="28" y="105" font-size="18" fill="#f4dfca">仿真 / 实机的可证伪证据</text><path d="M28 126H320" stroke="#e2aa7f" stroke-opacity=".24"/>
      <text x="28" y="160" font-size="16" fill="#e5c3aa">MuJoCo · Agibot A3</text><text x="28" y="191" font-size="16" fill="#e5c3aa">contact · balance · safe halt</text><text x="28" y="222" font-size="15" fill="#bf967e">qualification：RACKET CONTACT</text>
      <g transform="translate(28 246)"><rect width="126" height="30" rx="15" fill="#543126"/><text x="63" y="20" text-anchor="middle" font-size="13" fill="#f6d7bd">evidence gate</text></g>
    </g>
  </g>

  <g fill="none" stroke="#efb26d" stroke-width="4" marker-end="url(#arrow)" filter="url(#softGlow)"><path d="M408 387H428"/><path d="M776 387H796"/><path d="M1144 387H1164"/></g>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#f1c996"><text x="425" y="220" text-anchor="middle">state</text><text x="793" y="220" text-anchor="middle">target</text><text x="1161" y="220" text-anchor="middle">action</text></g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="74" y="588" width="1452" height="116" rx="20" fill="#081722" fill-opacity=".72" stroke="#6fa9a0" stroke-opacity=".28"/>
    <text x="104" y="625" font-size="15" letter-spacing="3" fill="#78d4c5">CLOSED-LOOP EVIDENCE</text>
    <text x="104" y="665" font-size="17" fill="#d9ece7">命中后不是“任务完成”，而是把接触结果、身体稳定性与下一次观测重新送回估计器。</text>
    <text x="104" y="690" font-size="15" fill="#89aaa7">contact result  →  physical feedback  →  next observation</text>
    <path d="M1500 538V566H100V538" fill="none" stroke="#78d4c5" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowFeedback)"/>
    <text x="800" y="558" text-anchor="middle" font-size="14" fill="#8fc4ba">physical feedback / next observation</text>
  </g>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#86a8a5"><text x="74" y="744" font-size="14">HOPE · planning, control and deployment are separate contracts — the loop is only as strong as its weakest interface.</text><text x="1526" y="744" text-anchor="end" font-size="14" fill="#d5a36e">not an assumption · an executable claim</text></g>
</svg>
