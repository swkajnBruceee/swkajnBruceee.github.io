<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-orin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b09b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient-orin)"/>

  <!-- Network sharing icon -->
  <g transform="translate(100, 150)">
    <circle cx="60" cy="60" r="50" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- PC -->
    <rect x="20" y="55" width="28" height="18" rx="3" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <rect x="22" y="57" width="24" height="12" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="28" y="74" width="12" height="3" rx="1.5" fill="rgba(255,255,255,0.6)"/>

    <!-- Jetson NX -->
    <rect x="72" y="55" width="28" height="18" rx="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <rect x="76" y="59" width="8" height="6" rx="1" fill="rgba(0,0,0,0.35)"/>
    <rect x="86" y="59" width="8" height="6" rx="1" fill="rgba(0,0,0,0.35)"/>
    <rect x="76" y="67" width="18" height="4" rx="1" fill="rgba(0,0,0,0.25)"/>

    <!-- Ethernet link -->
    <line x1="48" y1="64" x2="72" y2="64" stroke="rgba(255,255,255,0.75)" stroke-width="4" stroke-linecap="round"/>
    <rect x="57" y="60" width="6" height="8" rx="1.5" fill="rgba(255,255,255,0.85)"/>

    <!-- USB label -->
    <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" font-weight="600">USB</text>
    <circle cx="68" cy="38" r="3" fill="rgba(255,255,255,0.75)"/>
    <line x1="48" y1="42" x2="65" y2="38" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="250" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold" fill="white">
    Orin NX 供网实战
  </text>

  <!-- Subtitle -->
  <text x="250" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="rgba(255,255,255,0.85)">
    网线共享 · IP 转发 · NAT · USB 共享
  </text>

  <!-- Keywords -->
  <text x="250" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="rgba(255,255,255,0.65)">
    Jetson • 远程连接 • 以太网 • 上网配置
  </text>

  <!-- Decorative elements -->
  <rect x="940" y="90" width="110" height="110" rx="22" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1085" cy="500" r="70" fill="rgba(255,255,255,0.08)"/>
  <rect x="120" y="455" width="80" height="80" rx="16" fill="rgba(255,255,255,0.12)"/>

  <!-- Network nodes -->
  <g transform="translate(880, 260)" opacity="0.25">
    <circle cx="0" cy="0" r="8" fill="white"/>
    <circle cx="60" cy="-30" r="6" fill="white"/>
    <circle cx="90" cy="20" r="5" fill="white"/>
    <circle cx="40" cy="40" r="4" fill="white"/>
    <line x1="0" y1="0" x2="60" y2="-30" stroke="white" stroke-width="2"/>
    <line x1="60" y1="-30" x2="90" y2="20" stroke="white" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="40" stroke="white" stroke-width="2"/>
  </g>
</svg>
